<style>
:root{
  --inkt:#171A1F; --papier:#EEF1F4; --paneel:#FFF; --steen:#6E7684;
  --aalto:#1B3FA0; --geo:#B36A15; --viking:#6B3FA0; --rand:rgba(23,26,31,.13);
  --sheet:58dvh; --peek:92px; --safe:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,input{touch-action:manipulation}
html,body{height:100%;height:100dvh;margin:0;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:var(--papier);color:var(--inkt);font-family:var(--font);font-size:15px;line-height:1.45}

/* ---- kop ---- */
#kop{
  position:fixed;top:0;left:0;right:0;z-index:900;background:var(--paneel);
  border-bottom:1px solid var(--rand);padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;
}
#kop h1{font-size:16px;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
#kop h1 span{font-weight:400;color:var(--steen);font-size:13px}
#lagen{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#lagen::-webkit-scrollbar{display:none}
.tog{
  flex:none;border:1px solid var(--rand);background:var(--paneel);color:var(--steen);
  padding:7px 12px;border-radius:999px;font:inherit;font-size:13px;min-height:36px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.tog .punt{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.tog[aria-pressed="true"]{color:var(--inkt);border-color:currentColor;background:rgba(23,26,31,.05);font-weight:600}
.tog[aria-pressed="false"]{opacity:.5}

/* ---- kaart ---- */
#kaart{position:fixed;inset:0;background:#DCE3E8;z-index:1}

/* ---- bottom sheet ---- */
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:950;background:var(--paneel);
  border-top:1px solid var(--rand);border-radius:16px 16px 0 0;
  box-shadow:0 -3px 18px rgba(23,26,31,.13);
  height:var(--sheet);max-height:640px;transform:translateY(calc(var(--sheet) - var(--peek)));
  transition:transform .22s ease;display:flex;flex-direction:column;
  padding-bottom:var(--safe);touch-action:none;
}
#sheet.open{transform:translateY(0)}
#greep{padding:8px 14px 10px;flex:none;cursor:grab}
#greep .bar{width:38px;height:4px;border-radius:2px;background:var(--rand);margin:0 auto 8px}
#greep .rij{display:flex;align-items:center;gap:10px}
#greep .titel{font-weight:600;font-size:14px}
#greep .telling{color:var(--steen);font-size:13px;margin-left:auto;font-variant-numeric:tabular-nums}
#zoek{
  margin:0 14px 8px;padding:10px 12px;border-radius:9px;border:1px solid var(--rand);
  background:var(--papier);color:var(--inkt);font:inherit;font-size:16px;flex:none;
}
#zoek:focus{outline:2px solid var(--aalto);outline-offset:1px}
#cats{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;flex:none;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
#lijst{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding-bottom:20px;overscroll-behavior:contain}
.item{
  width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rand);
  color:inherit;font:inherit;padding:12px 14px;min-height:58px;display:block;cursor:pointer;
}
.item:active{background:rgba(27,63,160,.08)}
.item .naam{font-weight:600;font-size:14.5px;line-height:1.25}
.item .meta{color:var(--steen);font-size:12px;margin-top:3px;display:flex;gap:8px;align-items:center}
.item .streep{width:3px;height:12px;border-radius:2px;flex:none}
.item .afstand{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.merk{margin-left:5px;font-size:11px}
.merk.expo{color:var(--geo)} .merk.vik{color:var(--viking)} .merk.winter{color:var(--aalto)}
#voet{padding:14px;color:var(--steen);font-size:11.5px;border-top:1px solid var(--rand)}
#voet button{background:none;border:0;color:var(--aalto);font:inherit;font-size:11.5px;padding:6px 0;cursor:pointer;text-decoration:underline}

/* ---- popups ---- */
.leaflet-popup-content-wrapper{background:var(--paneel);color:var(--inkt);border-radius:10px;border:1px solid var(--rand);box-shadow:0 4px 20px rgba(23,26,31,.18)}
.leaflet-popup-content{margin:12px 14px;font-size:13.5px;line-height:1.45}
.leaflet-container a.leaflet-popup-close-button{width:34px;height:34px;font-size:20px;padding:6px 6px 0 0;color:var(--steen)}
.pop-cat{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--steen)}
.pop-naam{font-weight:700;font-size:16px;margin:2px 0 1px;line-height:1.2}
.pop-isl{color:var(--steen);font-size:12.5px;font-style:italic;margin-bottom:5px}
.pop-adres{color:var(--steen);font-size:12.5px;margin-bottom:6px}
.pop-links{margin-top:10px;display:flex;flex-direction:column;gap:2px}
.pop-links a{color:var(--aalto);font-size:13.5px;padding:6px 0;display:inline-block}
.pop-expo{margin-top:8px;padding:7px 9px;border-left:2px solid var(--geo);background:rgba(179,106,21,.10);font-size:12.5px}
.pop-winter{margin-top:8px;padding:7px 9px;border-left:2px solid var(--aalto);background:rgba(27,63,160,.09);font-size:12.5px}
.leaflet-control-attribution{background:rgba(255,255,255,.82)!important;color:var(--steen)!important;font-size:10px!important}
.leaflet-bottom.leaflet-right{margin-bottom:calc(var(--peek) - 8px)}
.leaflet-control-zoom{display:none}
.marker{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.marker i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(23,26,31,.4);display:block}
.marker.thuis i{width:15px;height:15px;border-radius:3px;transform:rotate(45deg)}
#hier{
  position:fixed;right:12px;bottom:calc(var(--peek) + 16px + var(--safe));z-index:940;width:46px;height:46px;
  border-radius:50%;border:1px solid var(--rand);background:var(--paneel);font-size:19px;
  box-shadow:0 2px 10px rgba(23,26,31,.16);cursor:pointer;line-height:1;
}
@media (min-width:900px){
  :root{--sheet:100dvh}
  #sheet{left:auto;right:0;top:0;width:380px;height:100dvh;border-radius:0;border-left:1px solid var(--rand);border-top:0;transform:none;box-shadow:none;padding-top:64px}
  #greep .bar{display:none}
  #kaart{right:380px}
  .leaflet-control-zoom{display:block}
  #hier{right:396px;bottom:20px}
  .leaflet-bottom.leaflet-right{margin-bottom:0}
}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
</style>
</head>

const THUIS=[64.1512,-21.9470];
const FIJN = window.matchMedia('(pointer:fine)').matches;
const CACHE='rvk-coords-v2';
let vertrek=THUIS.slice(), vertrekNaam='Mýrargata 18';

/* Leaflet laden met reservebron; pas daarna starten */
function laadLeaflet(klaar){
  if(window.L) return klaar();
  const bronnen=['https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
                 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js'];
  (function volgende(i){
    if(i>=bronnen.length){
      document.getElementById('status').textContent=
        'De kaartbibliotheek kon niet geladen worden. Controleer de verbinding en herlaad de pagina.';
      document.getElementById('kaart').style.display='none';
      document.getElementById('sheet').classList.add('open');
      return;
    }
    const s=document.createElement('script');
    s.src=bronnen[i]; s.async=false;
    s.onload=klaar; s.onerror=()=>volgende(i+1);
    document.head.appendChild(s);
  })(0);
}
if(document.readyState==='loading')
  document.addEventListener('DOMContentLoaded',()=>laadLeaflet(start));
else laadLeaflet(start);

function start(){
/* ---------- kaart ---------- */
const kaart=L.map('kaart',{
  preferCanvas:true, zoomControl:FIJN, attributionControl:true,
  zoomSnap:.5, tap:false
}).setView([64.1465,-21.9400],13);

const OSM_ATTR='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const tegelOpties={maxZoom:19, minZoom:8, updateWhenIdle:false, updateWhenZooming:false, keepBuffer:2};
let tegels=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  Object.assign({},tegelOpties,{attribution:OSM_ATTR+' &copy; <a href="https://carto.com/attributions">CARTO</a>'})).addTo(kaart);

/* valt CARTO weg, dan de standaardtegels van OpenStreetMap */
let fouten=0, gewisseld=false;
tegels.on('tileerror',()=>{
  if(gewisseld || ++fouten<5) return;
  gewisseld=true;
  kaart.removeLayer(tegels);
  tegels=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    Object.assign({},tegelOpties,{attribution:OSM_ATTR})).addTo(kaart);
  tegels.on('tileerror',()=>melding('Achtergrondkaart niet bereikbaar — markers en lijst werken wel'));
  melding('Achtergrondkaart via OpenStreetMap');
});

const laagMusea=L.layerGroup().addTo(kaart);
const laagExpo =L.layerGroup().addTo(kaart);
const laagVik  =L.layerGroup();

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function afstand(a,b){
  const R=6371,r=Math.PI/180,dLat=(b[0]-a[0])*r,dLon=(b[1]-a[1])*r;
  const x=Math.sin(dLat/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
const icoon=(kleur,thuis)=>L.divIcon({className:'',
  html:'<div class="marker'+(thuis?' thuis':'')+'"><i style="background:'+kleur+'"></i></div>',
  iconSize:[26,26],iconAnchor:[13,13]});

function popupHTML(m){
  const L2=[];
  if(m.u) L2.push('<a href="'+m.u+'" target="_blank" rel="noopener">Officiële website'+(m.vfl?' †':'')+' ↗</a>');
  if(m.v) L2.push('<a href="https://visitreykjavik.is/service/'+m.v+'" target="_blank" rel="noopener">Visit Reykjavík ↗</a>');
  L2.push('<a href="https://www.google.com/maps/dir/?api=1&destination='+m.ll[0]+','+m.ll[1]+'" target="_blank" rel="noopener">Route hierheen ↗</a>');
  return '<div class="pop-cat">'+CATS[m.c].label+' · '+m.km.toFixed(1)+' km</div>'+
   '<div class="pop-naam">'+esc(m.n)+'</div>'+
   (m.isl?'<div class="pop-isl">'+esc(m.isl)+'</div>':'')+
   '<div class="pop-adres">'+esc(m.a)+'</div><div>'+esc(m.d)+'</div>'+
   (m.t?'<div class="pop-expo"><strong>6–11 nov 2026</strong><br>'+esc(m.t)+'</div>':'')+
   (m.w?'<div class="pop-winter">'+esc(m.w)+'</div>':'');
}
const popOpties={maxWidth:Math.min(320,innerWidth-48),autoPanPadding:[20,90]};

/* ---------- markers ---------- */
M.forEach(m=>{
  m.km=afstand(vertrek,m.ll);
  m.marker=L.marker(m.ll,{icon:icoon(CATS[m.c].kleur),title:m.n})
    .addTo(laagMusea).bindPopup(()=>popupHTML(m),popOpties);
});
const thuisMarker=L.marker(THUIS,{icon:icoon('#171A1F',true),title:'Logement'})
  .addTo(laagMusea).bindPopup('<div class="pop-cat">Vertrekpunt</div><div class="pop-naam">Mýrargata 18</div>',popOpties);

function ring(m,kleur,radius,dash,tip,html){
  const c=L.circleMarker(m.ll,{radius,color:kleur,weight:2.2,fill:false,dashArray:dash,interactive:true})
    .bindPopup(html,popOpties);
  if(FIJN) c.bindTooltip(tip,{direction:'top',offset:[0,-radius]});
  return c;
}
EXPO.forEach(e=>{
  const m=M.find(x=>x.n.includes(e.plek)); if(!m) return; e.m=m;
  e.ring=ring(m,'#B36A15',14,e.zeker?null:'4 4',e.titel,
    '<div class="pop-cat">Tentoonstelling · '+(e.zeker?'bevestigd':'nog te bevestigen')+'</div>'+
    '<div class="pop-naam">'+esc(e.titel)+'</div><div class="pop-isl">'+esc(m.n)+'</div>'+
    '<div class="pop-adres">'+esc(e.periode)+'</div><div>'+esc(e.info)+'</div>'+
    '<div class="pop-links"><a href="'+e.url+'" target="_blank" rel="noopener">Programma ↗</a></div>').addTo(laagExpo);
});
VIKING.forEach(v=>{
  const m=M.find(x=>x.n.includes(v.plek)); if(!m) return; v.m=m;
  v.ring=ring(m,'#6B3FA0',20,null,'Vikingtijd: '+m.n,
    '<div class="pop-cat">Vikingtijd &amp; landname</div><div class="pop-naam">'+esc(m.n)+'</div>'+
    '<div class="pop-adres">'+esc(m.a)+'</div><div>'+esc(v.info)+'</div>').addTo(laagVik);
});

/* ---------- laagknoppen ---------- */
const groepen={musea:laagMusea,expo:laagExpo,vik:laagVik};
document.querySelectorAll('.tog').forEach(b=>{
  const g=groepen[b.dataset.laag];
  if(b.getAttribute('aria-pressed')==='false') kaart.removeLayer(g);
  b.addEventListener('click',()=>{
    const aan=b.getAttribute('aria-pressed')==='true';
    b.setAttribute('aria-pressed',String(!aan));
    aan?kaart.removeLayer(g):kaart.addLayer(g);
  });
});

/* ---------- categoriefilters + lijst ---------- */
const actief=new Set(Object.keys(CATS));
const cats=document.getElementById('cats');
Object.entries(CATS).forEach(([k,c])=>{
  const b=document.createElement('button');
  b.className='tog'; b.type='button'; b.setAttribute('aria-pressed','true'); b.style.color=c.kleur;
  b.innerHTML='<span class="punt"></span>'+c.label;
  b.addEventListener('click',()=>{
    actief.has(k)?actief.delete(k):actief.add(k);
    b.setAttribute('aria-pressed',String(actief.has(k)));
    teken();
  });
  cats.appendChild(b);
});

const lijst=document.getElementById('lijst'), telling=document.getElementById('telling');
const zoek=document.getElementById('zoek');
let timer; zoek.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(teken,160)});

function teken(){
  const q=zoek.value.trim().toLowerCase();
  const frag=document.createDocumentFragment();
  let n=0;
  M.slice().sort((a,b)=>a.km-b.km).forEach(m=>{
    const zicht=actief.has(m.c)&&(!q||(m.n+' '+m.isl+' '+m.a+' '+m.d).toLowerCase().includes(q));
    if(!zicht){ laagMusea.removeLayer(m.marker); return; }
    m.marker.addTo(laagMusea); n++;
    const b=document.createElement('button');
    b.className='item'; b.type='button';
    const heeftVik=VIKING.some(v=>v.m===m);
    b.innerHTML='<div class="naam">'+esc(m.n)+
      (m.t?'<span class="merk expo">●</span>':'')+
      (heeftVik?'<span class="merk vik">◆</span>':'')+
      (m.w?'<span class="merk winter">❄</span>':'')+'</div>'+
      '<div class="meta"><span class="streep" style="background:'+CATS[m.c].kleur+'"></span>'+
      esc(m.a)+'<span class="afstand">'+m.km.toFixed(1)+' km</span></div>';
    b.addEventListener('click',()=>{
      dicht();
      kaart.setView(m.ll,16,{animate:true});
      setTimeout(()=>m.marker.openPopup(),260);
    });
    frag.appendChild(b);
  });
  lijst.replaceChildren(frag);
  telling.textContent=n+' van '+M.length;
}

/* ---------- bottom sheet ---------- */
const sheet=document.getElementById('sheet'), greep=document.getElementById('greep');
const open=()=>sheet.classList.add('open'), dicht=()=>sheet.classList.remove('open');
greep.addEventListener('click',()=>sheet.classList.toggle('open'));
let y0=null;
greep.addEventListener('pointerdown',e=>{y0=e.clientY;greep.setPointerCapture(e.pointerId)});
greep.addEventListener('pointerup',e=>{
  if(y0===null) return;
  const dy=e.clientY-y0; y0=null;
  if(dy<-30) open(); else if(dy>30) dicht();
});
zoek.addEventListener('focus',open);

/* ---------- mijn positie ---------- */
let mijnMarker=null;
document.getElementById('hier').addEventListener('click',()=>{
  if(!navigator.geolocation){ melding('Geolocatie niet beschikbaar'); return; }
  melding('Positie bepalen…');
  navigator.geolocation.getCurrentPosition(p=>{
    const ll=[p.coords.latitude,p.coords.longitude];
    vertrek=ll; vertrekNaam='je huidige positie';
    if(mijnMarker) mijnMarker.setLatLng(ll);
    else mijnMarker=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#1B3FA0',fillOpacity:1}).addTo(kaart);
    M.forEach(m=>m.km=afstand(vertrek,m.ll));
    teken(); kaart.setView(ll,14);
    melding('Afstanden vanaf je huidige positie');
  },()=>melding('Positie niet gevonden — afstanden blijven vanaf Mýrargata 18'),{enableHighAccuracy:false,timeout:8000,maximumAge:300000});
});

/* ---------- posities: cache eerst, netwerk pas als het moet ---------- */
const status=document.getElementById('status');
const melding=t=>status.textContent=t;

function leesCache(){ try{ return JSON.parse(localStorage.getItem(CACHE)||'{}'); }catch(e){ return {}; } }
function schrijfCache(o){ try{ localStorage.setItem(CACHE,JSON.stringify(o)); }catch(e){} }

function zetPositie(m,ll){
  m.ll=ll; m.km=afstand(vertrek,ll); m.exact=true; m.marker.setLatLng(ll);
  EXPO.forEach(e=>{ if(e.m===m&&e.ring) e.ring.setLatLng(ll); });
  VIKING.forEach(v=>{ if(v.m===m&&v.ring) v.ring.setLatLng(ll); });
}

async function posities(forceer){
  const cache=forceer?{}:leesCache();
  let uitCache=0;
  M.forEach(m=>{ if(m.g&&cache[m.g]) { zetPositie(m,cache[m.g]); uitCache++; } });
  const todo=M.filter(m=>m.g&&!cache[m.g]);
  teken();
  if(!todo.length){ melding(uitCache+' posities uit het geheugen — geen netwerk nodig'); return; }
  if(!navigator.onLine){ melding('Offline — posities bij benadering'); return; }
  let ok=0;
  for(let i=0;i<todo.length;i++){
    const m=todo[i];
    melding('Posities ophalen… '+(i+1)+'/'+todo.length+' (eenmalig)');
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(m.g));
      const j=await r.json();
      if(j&&j[0]){ const ll=[+j[0].lat,+j[0].lon]; cache[m.g]=ll; zetPositie(m,ll); ok++; }
    }catch(e){}
    await new Promise(r=>setTimeout(r,1100));
  }
  schrijfCache(cache); teken();
  melding(ok+' posities opgehaald en bewaard — de volgende keer laadt dit meteen');
}
document.getElementById('opnieuw').addEventListener('click',()=>posities(true));

/* ---------- resize ---------- */
let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>kaart.invalidateSize(),200)},{passive:true});
sheet.addEventListener('transitionend',()=>kaart.invalidateSize());

teken();
posities(false);
}
